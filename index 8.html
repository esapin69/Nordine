<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1B1A18" />
  <title>Charge.</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap');
    *{box-sizing:border-box} body{margin:0;background:#1B1A18;color:#E9E4D8;font-family:Inter,sans-serif}.app{min-height:100vh;padding:28px 18px 60px}.wrap{max-width:720px;margin:auto}.header h1{font:700 40px Oswald,sans-serif;text-transform:uppercase;margin:0}.header h1 span{color:#C9A227}.header p{margin:4px 0 0;color:#8C8578;font-size:14px}.tabs{display:flex;border:1px solid #3A3833;border-radius:999px;padding:4px;gap:4px;margin:22px 0 24px}.tab{flex:1;border:0;background:transparent;color:#8C8578;font:600 14px Oswald,sans-serif;letter-spacing:.6px;text-transform:uppercase;padding:11px;border-radius:999px;cursor:pointer}.tab.active{background:#C9A227;color:#1B1A18}.card{background:#211F1B;border:1px solid #3A3833;border-radius:14px;padding:22px;margin-bottom:18px}.card h2{font:600 16px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.6px;margin:0 0 16px}.field{margin-bottom:14px}.field label{display:block;font-size:12px;color:#8C8578;margin-bottom:6px;text-transform:uppercase;letter-spacing:.4px}.field input,.field select{width:100%;background:#15140F;border:1px solid #3A3833;color:#E9E4D8;font:15px 'JetBrains Mono',monospace;padding:10px 12px;border-radius:8px;outline:none}.field input:focus{border-color:#C9A227}.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pills{display:flex;gap:8px;flex-wrap:wrap}.pill{flex:1;min-width:90px;text-align:center;background:#15140F;border:1px solid #3A3833;color:#8C8578;padding:10px 8px;border-radius:8px;font-size:13px;cursor:pointer}.pill small{display:block;font:10px 'JetBrains Mono',monospace;margin-top:2px}.pill.active{border-color:#C9A227;color:#C9A227;background:rgba(201,162,39,.08)}.btn{font:600 14px Oswald,sans-serif;text-transform:uppercase;letter-spacing:.6px;border:0;border-radius:8px;padding:13px 18px;cursor:pointer;width:100%}.btn.primary{background:#C9A227;color:#1B1A18}.btn.danger{background:#B5432D;color:#E9E4D8}.btn.ghost{background:transparent;color:#8C8578;border:1px solid #3A3833}.btn:disabled{opacity:.45;cursor:not-allowed}.btnrow{display:flex;gap:10px;margin-top:10px}.barbell{text-align:center;padding:10px 0 4px}.barlabel{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#8C8578;margin-bottom:10px}.barrow{display:flex;align-items:center;justify-content:center;height:100px}.sleeve{width:34px;height:8px;background:#55524A;border-radius:2px}.plates{display:flex;align-items:center;gap:2px;flex-direction:row-reverse}.plate{border-radius:2px}.center{width:3px;height:40px;border-left:2px dashed;opacity:.6}.bartotal{font:700 26px 'JetBrains Mono',monospace;margin-top:8px}.bartotal span{font-size:13px;opacity:.7}.note{font-size:11px;color:#8C8578;margin-top:4px}.timeline{border-top:1px solid #3A3833;margin-top:6px}.tl{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #2A2823;font-size:13px}.tl.last{background:rgba(201,162,39,.06);border-radius:6px;padding-left:8px}.mono{font-family:'JetBrains Mono',monospace}.muted{color:#8C8578}.gold{color:#C9A227;font-weight:700}.mini{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:#15140F;border:1px solid #3A3833;border-radius:10px;margin-bottom:10px;cursor:pointer}.mini .name{font-weight:600}.mini .sub{font-size:12px;color:#8C8578;margin-top:2px}.iconbtn{background:none;border:0;color:#8C8578;font-size:18px;cursor:pointer}.suggest{background:rgba(201,162,39,.08);border:1px solid rgba(201,162,39,.4);border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:13px}.suggest b{color:#C9A227;font:700 16px 'JetBrains Mono',monospace}.setrow{display:grid;grid-template-columns:30px 1fr 1fr auto;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #2A2823;font-size:13px}.chip{font-size:10px;padding:3px 8px;border-radius:999px;text-transform:uppercase}.chip.ok{background:rgba(63,125,78,.15);color:#6FBE84}.chip.heavy{background:rgba(181,67,45,.18);color:#E08069}.hidden{display:none}@media(max-width:480px){.header h1{font-size:30px}.row2{grid-template-columns:1fr}.tl{grid-template-columns:38px 1fr auto}.tl .scheme{grid-column:2/4;text-align:left}}
  </style>
</head>
<body>
<div class="app"><div class="wrap">
  <div class="header"><h1>Charge<span>.</span></h1><p>Planification de charge et pilotage de séance, kilo par kilo.</p></div>
  <div class="tabs"><button id="tabGoal" class="tab active">Objectif 1RM</button><button id="tabFree" class="tab">Séance libre</button></div>
  <main id="app"></main>
</div></div>
<script>
const PLATE_COLORS={25:'#B5432D',20:'#3D5A80',15:'#C9A227',10:'#3F7D4E',5:'#E9E4D8',2.5:'#15140F',1.25:'#8C8578'};
const PLATE_WEIGHTS=[25,20,15,10,5,2.5,1.25];
const PACE={prudent:{label:'Prudent',rate:.005,hint:'0,5 %/semaine'},modere:{label:'Modéré',rate:.0075,hint:'0,75 %/semaine'},ambitieux:{label:'Ambitieux',rate:.012,hint:'1,2 %/semaine'}};
const $=s=>document.querySelector(s); const fmt=n=>{const r=Math.round(n*100)/100;return Number.isInteger(r)?String(r):r.toFixed(2).replace(/0$/,'').replace(/\.$/,'')};
const roundToStep=(v,s=1.25)=>Math.round(v/s)*s; const estimate1RM=(w,r)=>r<=1?w:w*(1+r/30);
function plateBreakdown(total,bar=20){let x=(total-bar)/2;if(x<=0)return{plates:[],leftover:0};let rem=x,plates=[];for(const p of PLATE_WEIGHTS){while(rem>=p-.001){plates.push(p);rem-=p}}return{plates,leftover:rem}}
function barbell(weight,label,accent='#C9A227'){const {plates,leftover}=plateBreakdown(weight);return `<div class="barbell"><div class="barlabel">${label}</div><div class="barrow"><div class="sleeve"></div><div class="plates">${plates.map(p=>`<div class="plate" title="${p} kg" style="height:${Math.max(30,Math.min(92,30+p*2.4))}px;width:${p>=10?14:9}px;background:${PLATE_COLORS[p]};${p===5?'border:1px solid #15140F':''}"></div>`).join('')}</div><div class="center" style="border-color:${accent}"></div></div><div class="bartotal" style="color:${accent}">${fmt(weight)} <span>kg</span></div>${leftover>.05?`<div class="note">+${fmt(leftover*2)} kg non chargeable avec ce jeu de disques</div>`:''}</div>`}
function generateProgram(cw,cr,tw,pace){const current1RM=estimate1RM(cw,cr);if(tw<=current1RM)return{alreadyThere:true,current1RM};const weeks=Math.min(78,Math.max(4,Math.ceil(Math.log(tw/current1RM)/Math.log(1+PACE[pace].rate))));let hyp=Math.max(1,Math.round(weeks*.4)),str=Math.max(1,Math.round(weeks*.35)),peak=weeks-hyp-str;if(peak<1){peak=1;if(hyp+str+peak>weeks)str=Math.max(1,weeks-hyp-peak)}if(hyp+str+peak!==weeks)hyp+=weeks-(hyp+str+peak);const plan=[];for(let i=1;i<=weeks;i++){const est=current1RM*Math.pow(tw/current1RM,i/weeks);let phase,pct,scheme;if(i<=hyp){phase='Volume';pct=.7;scheme='4 × 8–10'}else if(i<=hyp+str){phase='Force';pct=.8;scheme='4 × 5'}else{phase='Affûtage';pct=.9;scheme='3 × 3'}const last=i===weeks;plan.push({week:i,phase:last?'Jour J':phase,weight:last?tw:roundToStep(est*pct),scheme:last?'1 × 1 (tentative)':scheme,isLast:last})}return{current1RM,weeks,plan,hyp,str,peak}}
function suggestNext(type,w,r,heavy){if(heavy)return{weight:roundToStep(w*.9),note:'Charge réduite après une série trop lourde.'};if(type==='force'){if(r>=6)return{weight:roundToStep(w*1.05),note:'Marge confortable — on augmente la charge.'};if(r>=3)return{weight:w,note:'Zone de force optimale — on garde la charge.'};return{weight:roundToStep(w*.93),note:'Série difficile — on allège légèrement.'}}if(r>=12)return{weight:roundToStep(w*1.03),note:'Répétitions élevées — légère hausse de charge.'};if(r>=8)return{weight:w,note:'Bonne zone de volume — on garde la charge.'};return{weight:roundToStep(w*.92),note:'Sous la zone de volume — on allège pour tenir les reps.'}}
let goals=JSON.parse(localStorage.getItem('goals-list')||'[]');let sessions=JSON.parse(localStorage.getItem('free-sessions')||'[]');let active=JSON.parse(localStorage.getItem('free-active-session')||'null');let tab='goal',result=null,pace='modere',goalType='volume';
const save=()=>{localStorage.setItem('goals-list',JSON.stringify(goals));localStorage.setItem('free-sessions',JSON.stringify(sessions));localStorage.setItem('free-active-session',JSON.stringify(active))};
function render(){ $('#tabGoal').classList.toggle('active',tab==='goal');$('#tabFree').classList.toggle('active',tab==='free');tab==='goal'?renderGoal():renderFree() }
$('#tabGoal').onclick=()=>{tab='goal';render()};$('#tabFree').onclick=()=>{tab='free';render()};
function renderGoal(){const app=$('#app');app.innerHTML=`<section class="card"><h2>Nouvel objectif</h2><div class="field"><label>Exercice</label><input id="exercise" value="Développé couché"></div><div class="row2"><div class="field"><label>Charge soulevée aujourd'hui (kg)</label><input id="cw" type="number" step="0.01" placeholder="90"></div><div class="field"><label>Répétitions faites</label><input id="cr" type="number" placeholder="3"></div></div><div class="field"><label>Objectif — charge à soulever une fois (kg)</label><input id="tw" type="number" step="0.01" placeholder="100"></div><div class="field"><label>Rythme de progression</label><div class="pills">${Object.entries(PACE).map(([k,p])=>`<button class="pill ${pace===k?'active':''}" data-pace="${k}">${p.label}<small>${p.hint}</small></button>`).join('')}</div></div><button id="generate" class="btn primary">Générer le programme</button></section><div id="goalResult"></div>${goals.length?`<section class="card"><h2>Programmes enregistrés</h2>${goals.map(g=>`<div class="mini" data-load="${g.id}"><div><div class="name">${g.exercise}</div><div class="sub">${fmt(g.current1RM)} → ${fmt(g.targetWeight)} kg · ${g.weeks} sem.</div></div><button class="iconbtn" data-del="${g.id}">×</button></div>`).join('')}</section>`:''}`;
app.querySelectorAll('[data-pace]').forEach(b=>b.onclick=()=>{pace=b.dataset.pace;renderGoal()});$('#generate').onclick=()=>{const cw=+$('#cw').value,cr=parseInt($('#cr').value),tw=+$('#tw').value,exercise=$('#exercise').value.trim()||'Exercice';if(!cw||!cr||!tw)return;result={...generateProgram(cw,cr,tw,pace),exercise,currentWeight:cw,currentReps:cr,targetWeight:tw,pace};drawResult()};app.querySelectorAll('[data-del]').forEach(b=>b.onclick=e=>{e.stopPropagation();goals=goals.filter(g=>g.id!==b.dataset.del);save();renderGoal()});app.querySelectorAll('[data-load]').forEach(x=>x.onclick=()=>{result=goals.find(g=>g.id===x.dataset.load);drawResult()});if(result)drawResult()}
function drawResult(){const box=$('#goalResult');if(!result)return;if(result.alreadyThere){box.innerHTML=`<section class="card"><p>Ton 1RM estimé (<b>${fmt(result.current1RM)} kg</b>) atteint déjà l'objectif. Tente directement la charge avec un échauffement progressif.</p></section>`;return}box.innerHTML=`<section class="card"><h2>Charge de départ vs objectif</h2><div style="display:flex;gap:18px;justify-content:center;flex-wrap:wrap">${barbell(result.current1RM,'1RM estimé aujourd’hui','#4C6373')}${barbell(result.targetWeight,'Objectif','#C9A227')}</div><p style="text-align:center;color:#8C8578;font-size:13px">Programme sur <b style="color:#E9E4D8">${result.weeks} semaines</b> — ${result.hyp} sem. volume · ${result.str} sem. force · ${result.peak} sem. affûtage</p><div class="timeline">${result.plan.map(w=>`<div class="tl ${w.isLast?'last':''}"><div class="mono muted">S${String(w.week).padStart(2,'0')}</div><div>${w.phase}</div><div class="mono gold">${fmt(w.weight)} kg</div><div class="scheme muted">${w.scheme}</div></div>`).join('')}</div><div class="btnrow"><button id="saveGoal" class="btn primary">Enregistrer ce programme</button></div></section>`;$('#saveGoal').onclick=()=>{const entry={id:String(Date.now()),createdAt:new Date().toISOString(),...result};goals=[entry,...goals];save();renderGoal()}}
function renderFree(){const app=$('#app');if(!active){app.innerHTML=`<section class="card"><h2>Nouvelle séance libre</h2><div class="field"><label>Exercice</label><input id="freeExercise" placeholder="Squat"></div><div class="field"><label>Objectif de la séance</label><div class="pills"><button class="pill ${goalType==='volume'?'active':''}" data-type="volume">Volume</button><button class="pill ${goalType==='force'?'active':''}" data-type="force">Force</button></div></div><button id="start" class="btn primary">Démarrer la séance</button></section>${sessions.length?`<section class="card"><h2>Séances passées</h2>${sessions.slice(0,8).map(s=>`<div class="mini"><div><div class="name">${s.exercise}</div><div class="sub">${s.goalType==='volume'?'Volume':'Force'} · ${s.sets.length} séries</div></div><div class="sub">${new Date(s.startedAt).toLocaleDateString('fr-FR')}</div></div>`).join('')}</section>`:''}`;app.querySelectorAll('[data-type]').forEach(b=>b.onclick=()=>{goalType=b.dataset.type;renderFree()});$('#start').onclick=()=>{const ex=$('#freeExercise').value.trim();if(!ex)return;active={id:String(Date.now()),exercise:ex,goalType,startedAt:new Date().toISOString(),sets:[],suggestion:null};save();renderFree()};return}
let suggested=active.suggestion?.weight||active.sets[0]?.weight||'';app.innerHTML=`<section class="card"><h2>${active.exercise}<span style="float:right;font-size:11px;color:#8C8578">${active.goalType==='volume'?'Volume':'Force'}</span></h2>${active.suggestion?`<div class="suggest">Prochaine série : charger <b>${fmt(active.suggestion.weight)} kg</b> — ${active.suggestion.note}</div>`:''}<div id="liveBar">${barbell(+suggested||0,`Série ${active.sets.length+1}`,active.goalType==='force'?'#B5432D':'#3F7D4E')}</div><div class="row2"><div class="field"><label>Charge (kg)</label><input id="wi" type="number" step="0.01" value="${suggested}"></div><div class="field"><label>Répétitions</label><input id="ri" type="number" placeholder="10"></div></div><div class="btnrow"><button id="ok" class="btn primary">Valider la série</button></div><div class="btnrow"><button id="heavy" class="btn danger">Trop lourd</button></div>${active.sets.length?`<div style="margin-top:10px">${active.sets.map((s,i)=>`<div class="setrow"><div class="mono muted">#${i+1}</div><div>${fmt(s.weight)} kg</div><div>${s.reps?s.reps+' reps':'—'}</div><div><span class="chip ${s.tooHeavy?'heavy':'ok'}">${s.tooHeavy?'Trop lourd':'Validée'}</span></div></div>`).join('')}</div>`:''}<div class="btnrow" style="margin-top:16px"><button id="cancel" class="btn ghost">Annuler</button><button id="finish" class="btn primary">Terminer la séance</button></div></section>`;$('#wi').oninput=()=>{$('#liveBar').innerHTML=barbell(+$('#wi').value||0,`Série ${active.sets.length+1}`,active.goalType==='force'?'#B5432D':'#3F7D4E')};const add=heavy=>{const w=+$('#wi').value,r=parseInt($('#ri').value||'0');if(!w||(!heavy&&!r))return;active.sets.push({weight:w,reps:r||0,tooHeavy:heavy});active.suggestion=suggestNext(active.goalType,w,r||0,heavy);save();renderFree()};$('#ok').onclick=()=>add(false);$('#heavy').onclick=()=>add(true);$('#cancel').onclick=()=>{active=null;save();renderFree()};$('#finish').onclick=()=>{if(active.sets.length)sessions=[{...active,endedAt:new Date().toISOString()},...sessions];active=null;save();renderFree()}}
render();
</script>
</body>
</html>
